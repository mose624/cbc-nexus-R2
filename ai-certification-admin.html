<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Certification Payments | CBE Nexus Admin</title><link rel="stylesheet" href="ai-training.css"><link rel="stylesheet" href="customer-care.css?v=20261004-2">
</head><body class="ai-academy-page"><main style="max-width:1200px;margin:auto;padding:30px"><a href="index.html#dashboard">← Admin Dashboard</a><h1>🏆 AI Certification Payment Verification</h1><p>Certification fee: <strong>KSh 250</strong> to <strong>0798462815</strong>. Verify the M-Pesa confirmation against the payment before approving.</p><div id="status"></div><div id="list"></div></main><script>
async function load(){const s=document.getElementById("status"),l=document.getElementById("list");try{const r=await fetch("/api/admin/ai-certification-requests",{credentials:"same-origin",cache:"no-store"}),d=await r.json();if(!r.ok)throw new Error(d.error||"Admin login required.");const rows=d.requests||[];l.innerHTML=rows.length?rows.map(x=>'<article style="background:#fff;padding:18px;margin:14px 0;border-radius:14px;border-left:6px solid #f97316"><h2>'+x.learner_name+'</h2><p><strong>Course:</strong> '+x.course_title+'<br><strong>Final score:</strong> '+x.final_score+'%<br><strong>Module scores:</strong> '+(x.module_scores||[]).join(", ")+'<br><strong>M-Pesa receipt:</strong> <code>'+x.mpesa_receipt+'</code><br><strong>Payment number:</strong> '+x.payment_number+'<br><strong>Fee:</strong> KSh '+x.certification_fee+'<br><strong>Status:</strong> '+x.status+'</p><button onclick="verify(\''+x.id+'\',\'paid_verified\')" '+(x.status!=="pending_payment_verification"?"disabled":"")+'>✅ Verify Payment & Allow Certificate</button> <button onclick="verify(\''+x.id+'\',\'rejected\')" '+(x.status!=="pending_payment_verification"?"disabled":"")+'>Reject</button></article>').join(""):"<p>No certification requests.</p>"}catch(e){s.textContent=e.message}}async function verify(id,status){if(!confirm(status==="paid_verified"?"Confirm that the KSh 250 payment is genuine and approve this certificate?":"Reject this payment?"))return;const r=await fetch("/api/admin/ai-certification-payment",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({id,status})}),d=await r.json();alert(d.message||d.error||"Updated");load()}load();
</script><script src="customer-care.js?v=20261004-2" defer></script>
</body></html>
