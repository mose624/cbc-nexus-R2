<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your CBE Nexus password</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7fc;color:#17324d;font:16px Arial,sans-serif}.wrap{max-width:520px;margin:40px auto;padding:20px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #163b5b18}h1{color:#075b91}label{display:block;font-weight:600;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd8e4;border-radius:8px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#087dbb;color:white;font-weight:700;font-size:16px;margin-top:20px;cursor:pointer}.status{margin-top:14px;font-weight:600;line-height:1.5}.muted{color:#587087;font-size:14px}
</style></head><body><main class="wrap"><section class="card"><h1>Reset your password</h1><p class="muted">Choose a new password for your CBE Nexus account. Use at least 12 characters, including letters and numbers.</p><form id="resetForm"><label for="password">New password</label><input id="password" type="password" minlength="12" maxlength="200" autocomplete="new-password" required><label for="confirm">Confirm new password</label><input id="confirm" type="password" minlength="12" maxlength="200" autocomplete="new-password" required><button type="submit">Save new password</button><div class="status" id="status" role="status" aria-live="polite"></div></form><p><a href="/register.html">Back to registration</a> · <a href="/">CBE Nexus home</a></p></section></main>
<script>
const form=document.getElementById("resetForm"),statusEl=document.getElementById("status");
const params=new URLSearchParams(location.hash.replace(/^#/,""));
const accessToken=params.get("access_token");
const tokenType=params.get("type");
if(!accessToken||tokenType!=="recovery"){statusEl.textContent="This reset link is invalid or expired. Return to registration and request a new password-reset email.";form.querySelector("button").disabled=true;}
form.addEventListener("submit",async e=>{e.preventDefault();const password=document.getElementById("password").value,confirm=document.getElementById("confirm").value;if(password!==confirm){statusEl.textContent="The passwords do not match.";return;}if(password.length<12||!/[A-Za-z]/.test(password)||!/[0-9]/.test(password)){statusEl.textContent="Use at least 12 characters, including letters and numbers.";return;}const button=form.querySelector("button");button.disabled=true;statusEl.textContent="Updating password…";try{const response=await fetch("/api/accounts/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({accessToken,password})});const result=await response.json();if(!response.ok)throw new Error(result.error||"Password reset failed.");statusEl.textContent=result.message;form.reset();history.replaceState(null,"",location.pathname);}catch(error){statusEl.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
