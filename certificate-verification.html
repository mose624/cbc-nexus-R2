<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify CBE Nexus AI Certificate</title><link rel="stylesheet" href="ai-training.css?v=20261004-5"><style>.verify-page{max-width:850px;margin:auto;padding:50px 18px}.verify-card{background:#fff;border-radius:18px;border:1px solid #dce4ee;padding:30px;box-shadow:0 10px 30px rgba(16,33,63,.07)}.verify-card input{width:100%;padding:13px;border:1px solid #ccd6e2;border-radius:9px;font-size:1rem}.result{margin-top:22px;padding:20px;border-radius:12px;background:#f8fafc}.valid{border-left:5px solid #2e7d32}.invalid{border-left:5px solid #b71c1c}.result dt{font-weight:800;margin-top:10px}.result dd{margin:4px 0;color:#526176}</style><link rel="stylesheet" href="customer-care.css?v=20261004-2">
</head><body class="ai-academy-page"><header class="ai-nav"><a class="ai-brand" href="ai-training.html"><span>AI</span><strong>CBE Nexus AI Academy</strong></a><nav><a href="ai-training.html">Courses</a><a class="active" href="certificate-verification.html">Verify Certificate</a></nav></header><main class="verify-page"><div class="verify-card"><p class="eyebrow">CREDENTIAL VERIFICATION</p><h1>Verify a CBE Nexus AI Certificate</h1><p>Enter the unique certificate ID printed on the certificate or scan its QR code.</p><input id="id" placeholder="CBEN-AI-2026-XXXXXXXXXX"><button id="verify" class="ai-btn primary" style="margin-top:12px;width:100%">Verify Certificate</button><div id="result"></div></div></main><script>const input=document.getElementById("id"),result=document.getElementById("result");input.value=new URLSearchParams(location.search).get("id")||"";async function verify(){const id=input.value.trim();if(!id){result.innerHTML="<div class='result invalid'>Enter a certificate ID.</div>";return}result.innerHTML="<div class='result'>Checking certificate...</div>";try{const r=await fetch("/api/ai/certificates/verify?id="+encodeURIComponent(id)),d=await r.json();if(!r.ok||!d.verified)throw new Error(d.error||"Certificate could not be verified.");const c=d.certificate;result.innerHTML="<div class='result valid'><h2>✓ Certificate Verified</h2><dl><dt>Learner</dt><dd>"+c.learner_name+"</dd><dt>Course</dt><dd>"+c.course_title+"</dd><dt>Certificate ID</dt><dd>"+c.certificate_id+"</dd><dt>Assessment result</dt><dd>"+c.assessment_result+"%</dd><dt>Issued</dt><dd>"+new Date(c.issued_at).toLocaleDateString()+"</dd><dt>Framework alignment</dt><dd>UNESCO AI Competency Frameworks + European DigComp reference</dd></dl></div>"}catch(e){result.innerHTML="<div class='result invalid'><h2>Certificate not verified</h2><p>"+e.message+"</p></div>"}}document.getElementById("verify").onclick=verify;if(input.value)verify();</script><script src="customer-care.js?v=20261004-2" defer></script>
</body></html>
