<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot your CBE Nexus password?</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f7fc;color:#17324d;font:16px Arial,sans-serif}.wrap{max-width:520px;margin:40px auto;padding:20px}.card{background:white;border-radius:16px;padding:28px;box-shadow:0 8px 30px #163b5b18}h1{color:#075b91}label{display:block;font-weight:600;margin:18px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd8e4;border-radius:8px;font-size:16px}button{width:100%;padding:14px;border:0;border-radius:9px;background:#087dbb;color:white;font-weight:700;font-size:16px;margin-top:20px;cursor:pointer}.status{margin-top:14px;font-weight:600;line-height:1.5}.muted{color:#587087;font-size:14px}
</style></head><body><main class="wrap"><section class="card"><h1>Forgot your password?</h1><p class="muted">Enter the email address you used when registering. If an account exists, we’ll send you a secure password-reset link.</p><form id="forgotForm"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254" required placeholder="you@example.com"><button type="submit">Send password reset link</button><div class="status" id="status" role="status" aria-live="polite"></div></form><p><a href="/register.html">Back to registration / sign in</a> · <a href="/">CBE Nexus home</a></p></section></main>
<script>
document.getElementById("forgotForm").addEventListener("submit",async e=>{e.preventDefault();const button=e.currentTarget.querySelector("button"),status=document.getElementById("status"),email=document.getElementById("email").value.trim();button.disabled=true;status.textContent="Sending request…";try{const response=await fetch("/api/accounts/forgot-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email})});const result=await response.json();if(!response.ok)throw new Error(result.error||"Could not send reset request.");status.textContent=result.message;}catch(error){status.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
