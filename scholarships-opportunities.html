<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scholarships & Opportunities | CBE Nexus</title>
<meta name="description" content="Find scholarships, fellowships, grants, internships, competitions and study opportunities from CBE Nexus.">
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f7f9fc;color:#172033}.wrap{max-width:1150px;margin:auto;padding:28px 18px}.hero{background:linear-gradient(135deg,#0645ad,#0f766e);color:#fff;padding:45px 24px;border-radius:18px;margin-bottom:22px}.hero h1{margin:0 0 10px;font-size:2.3rem}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;background:#fff;padding:15px;border-radius:14px;box-shadow:0 4px 18px #00000012;margin-bottom:22px}input,select{padding:12px;border:1px solid #d5dbe5;border-radius:9px;width:100%;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 18px #00000010;border:1px solid #e7ebf2}.card.featured{border:2px solid #eab308}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#eef4ff;color:#0645ad;font-size:.78rem;font-weight:800;margin:2px}.deadline{font-weight:800;color:#b91c1c}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{display:inline-block;padding:10px 14px;border-radius:9px;text-decoration:none;font-weight:800;border:0;cursor:pointer}.apply{background:#0645ad;color:#fff}.share{background:#25d366;color:#fff}.empty{padding:35px;background:#fff;border-radius:14px;text-align:center}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.filters{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<section class="hero"><p>🎓 CBE NEXUS</p><h1>Scholarships & Opportunities</h1><p>Discover scholarships, fellowships, grants, internships, competitions, exchanges and other opportunities.</p></section>
<div class="filters"><input id="search" placeholder="Search opportunities..."><select id="type"><option value="">All types</option><option>Scholarship</option><option>Fellowship</option><option>Grant</option><option>Internship</option><option>Competition</option><option>Exchange</option><option>Research</option><option>Teacher Development</option><option>Youth Opportunity</option></select><select id="country"><option value="">All countries</option></select><select id="funding"><option value="">All funding</option><option>Fully Funded</option><option>Partially Funded</option><option>Free</option></select></div>
<section id="list" class="grid"></section>
</main><script>
let rows=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function render(){const s=document.getElementById("search").value.toLowerCase(),t=document.getElementById("type").value,c=document.getElementById("country").value,f=document.getElementById("funding").value;const out=rows.filter(x=>(!s||JSON.stringify(x).toLowerCase().includes(s))&&(!t||x.type===t)&&(!c||x.country===c)&&(!f||String(x.funding||"").toLowerCase().includes(f.toLowerCase())));document.getElementById("list").innerHTML=out.length?out.map(x=>'<article class="card '+(x.featured?'featured':'')+'"><span class="pill">'+esc(x.type)+'</span>'+(x.featured?'<span class="pill">⭐ Featured</span>':'')+'<h2>'+esc(x.title)+'</h2><p><strong>'+esc(x.organization||"Organization")+'</strong> · '+esc(x.country||"International")+'</p><p>'+esc(x.description||"")+'</p>'+(x.level?'<p><strong>Level:</strong> '+esc(x.level)+'</p>':'')+(x.field?'<p><strong>Field:</strong> '+esc(x.field)+'</p>':'')+(x.funding?'<p><strong>Funding:</strong> '+esc(x.funding)+'</p>':'')+(x.deadline?'<p class="deadline">Deadline: '+esc(x.deadline)+'</p>':'')+'<div class="actions"><a class="btn apply" target="_blank" rel="noopener" href="'+esc(x.apply_url)+'">Apply Now →</a><button class="btn share" onclick="share('+JSON.stringify(x.title)+')">WhatsApp</button></div></article>').join(""):'<div class="empty">No matching opportunities found.</div>'}
function share(title){window.open("https://wa.me/?text="+encodeURIComponent("🎓 "+title+"\n\nFind it on CBE Nexus: "+location.href),"_blank","noopener,noreferrer")}
async function load(){try{const r=await fetch("/api/opportunities?_="+Date.now());const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Could not load opportunities.");rows=d.opportunities||[];const cs=[...new Set(rows.map(x=>x.country).filter(Boolean))].sort();document.getElementById("country").innerHTML='<option value="">All countries</option>'+cs.map(x=>'<option>'+esc(x)+'</option>').join("");render()}catch(e){document.getElementById("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
["search","type","country","funding"].forEach(id=>document.getElementById(id).addEventListener("input",render));load();
</script></body></html>
