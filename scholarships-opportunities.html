</head><body><main class="wrap">
<section class="hero"><p>🎓 CBE NEXUS</p><h1>Scholarships & Opportunities</h1><p>Discover scholarships, fellowships, grants, internships, competitions, exchanges and other opportunities.</p></section>
<h2 class="section-title">🆕 Latest Opportunities</h2><section id="latest" class="grid latest"></section>
<h2 class="section-title">🔎 Find an Opportunity</h2><div class="filters"><input id="search" placeholder="Search opportunities..."><select id="region"><option value="">All Regions</option><option>Africa</option><option>Asia</option><option>Europe</option><option>North America</option><option>South America</option><option>Oceania</option><option>Middle East</option><option>International</option></select><select id="type"><option value="">All types</option><option>Scholarship</option><option>Fellowship</option><option>Grant</option><option>Internship</option><option>Competition</option><option>Exchange</option><option>Research</option><option>Teacher Development</option><option>Youth Opportunity</option></select><select id="level"><option value="">All Education Levels</option><option>Primary</option><option>Secondary</option><option>Undergraduate</option><option>Postgraduate</option><option>Master’s</option><option>PhD</option><option>Postdoctoral</option><option>Professional</option><option>Any Level</option></select><select id="country"><option value="">All Countries</option><option>Afghanistan</option><option>Albania</option><option>Algeria</option><option>Andorra</option><option>Angola</option><option>Antigua and Barbuda</option><option>Argentina</option><option>Armenia</option><option>Australia</option><option>Austria</option><option>Azerbaijan</option><option>Bahamas</option><option>Bahrain</option><option>Bangladesh</option><option>Barbados</option><option>Belarus</option><option>Belgium</option><option>Belize</option><option>Benin</option><option>Bhutan</option><option>Bolivia</option><option>Bosnia and Herzegovina</option><option>Botswana</option><option>Brazil</option><option>Brunei</option><option>Bulgaria</option><option>Burkina Faso</option><option>Burundi</option><option>Cabo Verde</option><option>Cambodia</option><option>Cameroon</option><option>Canada</option><option>Central African Republic</option><option>Chad</option><option>Chile</option><option>Chi ion><option>Mozambique</option><option>Myanmar</option><option>Namibia</option><option>Nauru</option><option>Nepal</option><option>Netherlands</option><option>New Zealand</option><option>Nicaragua</option><option>Niger</option><option>Nigeria</option><option>North Korea</option><option>North Macedonia</option><option>Norway</option><option>Oman</option><option>Pakistan</option><option>Palau</option><option>Palestine</option><option>Panama</option><option>Papua New Guinea</option><option>Paraguay</option><option>Peru</option><option>Philippines</option><option>Poland</option><option>Portugal</option><option>Qatar</option><option>Romania</option><option>Russia</option><option>Rwanda</option><option>Saint Kitts and Nevis</option><option>Saint Lucia</option><option>Saint Vincent and the Grenadines</option><option>Samoa</option><option>San Marino</option><option>São Tomé and Príncipe</option><option>Saudi Arabia</option><option>Senegal</option><option>Serbia</option><option>Seychelles</option><option>Sierra Leone</option><option>Singapore</option><option>Slovakia</option><option>Slovenia</option><option>Solomon Islands</option><option>Somalia</option><option>South Africa</option><option>South Korea</option><option>South Sudan</option><option>Spain</option><option>Sri Lanka</option><option>Sudan</option><option>Suriname</option><option>Sweden</option><option>Switzerland</option><option>Syria</option><option>Taiwan</option><option>Tajikistan</option><option>Tanzania</option><option>Thailand</option><option>Timor-Leste</option><option>Togo</option><option>Tonga</option><option>Trinidad and Tobago</option><option>Tunisia</option><option>Türkiye</option><option>Turkmenistan</option><option>Tuvalu</option><option>Uganda</option><option>Ukraine</option><option>United Arab Emirates</option><option>United Kingdom</option><option>United States</option><option>Uruguay</option><option>Uzbekistan</option><option>Vanuatu</option><option>Vatican City</option><option>Venezuela</option><option>Vietnam</option><option>Yemen</option><option>Zambia</option><option>Zimbabwe</option></select><select id="funding"><option value="">All funding</option><option>Fully Funded</option><option>Partially Funded</option><option>Free</option></select><select id="sort"><option value="newest">Latest first</option><option value="deadline">Deadline soonest</option><option value="deadline-latest">Deadline latest</option></select></div>
<div class="resultbar"><span id="count">0 opportunities</span><span>Updated from CBE Nexus</span></div><section id="list" class="grid"></section>
</main><script>
let rows=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const regionMap={Africa:["Kenya","Uganda","Tanzania","Rwanda","South Africa","Nigeria","Ghana","Ethiopia","Egypt","Algeria","Angola","Benin","Botswana","Burkina Faso","Burundi","Cameroon","Chad","Côte d'Ivoire","Eswatini","Gabon","Gambia","Guinea","Liberia","Malawi","Mali","Mauritius","Morocco","Mozambique","Namibia","Niger","Senegal","Seychelles","Sierra Leone","Somalia","South Sudan","Sudan","Zambia","Zimbabwe","Madagascar","Lesotho"],Asia:["India","China","Japan","South Korea","Singapore","Malaysia","Indonesia","Philippines","Thailand","Vietnam","Pakistan","Bangladesh","Nepal","Sri Lanka","Taiwan","Mongolia","Cambodia","Laos","Myanmar","Brunei"],Europe:["United Kingdom","Ireland","Germany","France","Netherlands","Sweden","Norway","Finland","Denmark","Switzerland","Belgium","Austria","Italy","Spain","Portugal","Poland","Czech Republic","Hungary","Greece","Romania","Bulgaria","Croatia","Serbia","Ukraine","Russia","Iceland","Estonia","Latvia","Lithuania","Slovakia","Slovenia","Türkiye"],"North America":["United States","Canada","Mexico","Costa Rica","Panama","Cuba","Jamaica","Bahamas","Barbados","Haiti","Dominican Republic","Guatemala","Honduras","El Salvador","Nicaragua","Trinidad and Tobago"],"South America":["Brazil","Argentina","Chile","Colombia","Peru","Ecuador","Bolivia","Paraguay","Uruguay","Venezuela","Guyana","Suriname"],Oceania:["Australia","New Zealand","Fiji","Samoa","Tonga","Vanuatu","Kiribati","Tuvalu","Nauru","Palau","Micronesia","Marshall Islands","Solomon Islands","Papua New Guinea"],"Middle East":["United Arab Emirates","Saudi Arabia","Qatar","Kuwait","Bahrain","Oman","Jordan","Israel","Palestine","Lebanon","Iraq","Iran","Yemen","Syria"]};
const getRegion=c=>Object.keys(regionMap).find(r=>regionMap[r].includes(c))||"International";
const dateVal=v=>{const t=Date.parse(v||"");return Number.isNaN(t)?Infinity:t};
function card(x){return '<article class="card '+(x.featured?'featured':'')+'"><span class="pill">'+esc(x.type)+'</span>'+(x.featured?'<span class="pill">⭐ Featured</span>':'')+'<h2>'+esc(x.title)+'</h2><p><strong>'+esc(x.organization||"Organization")+'</strong> · '+esc(x.country||"International")+'</p><p>'+esc(x.description||"")+'</p>'+(x.level?'<p><strong>Level:</strong> '+esc(x.level)+'</p>':'')+(x.field?'<p><strong>Field:</strong> '+esc(x.field)+'</p>':'')+(x.funding?'<p><strong>Funding:</strong> '+esc(x.funding)+'</p>':'')+(x.deadline?'<p class="deadline">Deadline: '+esc(x.deadline)+'</p>':'')+'<div class="actions"><a class="btn apply" target="_blank" rel="noopener" href="'+esc(x.apply_url)+'">Apply Now →</a><button class="btn share" onclick="share('+JSON.stringify(x.title)+')">WhatsApp</button></div></article>'}
function render(){const s=document.getElementById("search").value.toLowerCase(),t=document.getElementById("type").value,c=document.getElementById("country").value,f=document.getElementById("funding").value,l=document.getElementById("level").value,g=document.getElementById("region").value,sort=document.getElementById("sort").value;let out=rows.filter(x=>(!s||JSON.stringify(x).toLowerCase().includes(s))&&(!t||x.type===t)&&(!c||x.country===c)&&(!f||String(x.funding||"").toLowerCase().includes(f.toLowerCase()))&&(!l||String(x.level||"").toLowerCase().includes(l.toLowerCase()))&&(!g||getRegion(x.country)===g));out.sort((a,b)=>sort==="deadline"?dateVal(a.deadline)-dateVal(b.deadline):sort==="deadline-latest"?dateVal(b.deadline)-dateVal(a.deadline):dateVal(b.created_at)-dateVal(a.created_at));document.getElementById("count").textContent=out.length+" opportunit"+(out.length===1?"y":"ies");document.getElementById("list").innerHTML=out.length?out.map(card).join(""):'<div class="empty">No matching opportunities found.</div>'}
function renderLatest(){const latest=[...rows].sort((a,b)=>dateVal(b.created_at)-dateVal(a.created_at)).slice(0,6);document.getElementById("latest").innerHTML=latest.length?latest.map(card).join(""):'<div class="empty">No opportunities published yet.</div>'}
function share(title){window.open("https://wa.me/?text="+encodeURIComponent("🎓 "+title+"\n\nFind it on CBE Nexus: "+location.href),"_blank","noopener,noreferrer")}
async function load(){try{const r=await fetch("/api/opportunities?_="+Date.now());const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Could not load opportunities.");rows=d.opportunities||[];renderLatest();render()}catch(e){document.getElementById("list").innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
["search","region","type","level","country","funding","sort"].forEach(id=>document.getElementById(id).addEventListener("input",render));load();
</script><script src="customer-care.js?v=20261004-2" defer></script>
</body></html>
