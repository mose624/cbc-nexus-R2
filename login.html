<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | CBE Nexus</title><meta name="description" content="Sign in to your CBE Nexus account."><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#172b4d;background:#f2f7fc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,440px);background:#fff;border:1px solid #dce6f1;border-radius:18px;padding:30px;box-shadow:0 12px 36px #17365d12}.brand{font-size:24px;font-weight:800;color:#1257a6;margin-bottom:8px}h1{font-size:25px;margin:18px 0 8px}p{color:#52657d;line-height:1.5}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #bdcbdc;border-radius:9px;font:inherit}button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#1478cf;color:white;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{min-height:24px;margin-top:14px;color:#a12a2a}.links{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}a{color:#1267b2;text-decoration:none;font-weight:600}.muted{font-size:13px}
</style></head><body><main class="panel"><div class="brand">🎓 CBE Nexus</div><p>Connecting learners to excellence</p><h1>Log in to your account</h1><p>Use the email address and password you chose during registration.</p><form id="loginForm"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="loginButton" type="submit">Log in</button><p id="status" role="status" aria-live="polite"></p></form><div class="links"><a href="/forgot-password.html">Forgot password?</a><a href="/register.html">Create an account</a></div><p class="muted"><a href="/">← Back to CBE Nexus</a></p></main>
<script>
document.getElementById("loginForm").addEventListener("submit",async function(event){event.preventDefault();const form=event.currentTarget,button=document.getElementById("loginButton"),status=document.getElementById("status");const email=form.email.value.trim(),password=form.password.value;status.textContent="Signing in…";button.disabled=true;try{const response=await fetch("/api/accounts/login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify({email,password})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.error||"Unable to sign in.");sessionStorage.setItem("cbe_nexus_session",JSON.stringify(result.session));sessionStorage.setItem("cbe_nexus_user",JSON.stringify(result.user));status.style.color="#187344";status.textContent="Login successful. Opening CBE Nexus…";window.location.href="/#dashboard";}catch(error){status.style.color="#a12a2a";status.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
