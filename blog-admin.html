<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CBE Nexus Blog Admin</title><link rel="stylesheet" href="blog.css"><style>main{max-width:1000px;margin:auto;padding:30px 20px}label{display:block;font-weight:800;margin-top:14px}input,textarea,select{width:100%;padding:12px;border:1px solid #d8cf9b;border-radius:9px;margin-top:6px}textarea{min-height:260px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{margin:20px 0;display:flex;gap:10px;flex-wrap:wrap}button{padding:11px 16px;border:0;border-radius:9px;cursor:pointer}.primary{background:#172033;color:white}.post{background:white;border:1px solid #eadf9c;border-radius:12px;padding:15px;margin:10px 0}@media(max-width:650px){.row{grid-template-columns:1fr}}</style><link rel="stylesheet" href="customer-care.css?v=20261004-2">
</head><body><header><a class="brand" href="/blog.html">CBE <span>Nexus</span> Blog Admin</a><a href="/blog.html">View Blog</a></header><main><h1>Publish a Blog Article</h1><p>Enter your Blog Admin Token. Keep this page private.</p><input id="token" type="password" placeholder="Blog Admin Token"><form id="form"><div class="row"><div><label>Title</label><input id="title" required></div><div><label>Category</label><select id="category"><option>Teacher Jobs</option><option>AI for Teachers</option><option>CBC/CBE</option><option>Teaching Tips</option><option>Opportunities</option><option>Education News</option></select></div></div><label>Excerpt</label><textarea id="excerpt" style="min-height:100px"></textarea><label>Article HTML</label><textarea id="content" required placeholder="Use headings, paragraphs, lists and links."></textarea><div class="row"><div><label>Featured image URL</label><input id="image"></div><div><label>Keywords</label><input id="keywords"></div></div><div class="row"><div><label>SEO title</label><input id="seoTitle"></div><div><label>Meta description</label><input id="meta"></div></div><label>Publish status</label><select id="status"><option value="published">Published</option><option value="draft">Draft</option></select><div class="actions"><button class="primary">Save Article</button><button type="button" onclick="loadPosts()">Refresh Articles</button></div></form><div id="msg"></div><h2>Articles</h2><div id="list"></div></main><script>const $=id=>document.getElementById(id);async function save(e){e.preventDefault();const p={title:$('title').value,category:$('category').value,excerpt:$('excerpt').value,content:$('content').value,featuredImage:$('image').value,keywords:$('keywords').value,seoTitle:$('seoTitle').value,metaDescription:$('meta').value,status:$('status').value,author:'CBE Nexus'};const r=await fetch('/api/admin/blog/post',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value},body:JSON.stringify(p)});const j=await r.json();$('msg').textContent=j.ok?'Article published successfully.':j.error||'Save failed';if(j.ok)e.target.reset();loadPosts()}async function loadPosts(){if(!$('token').value)return;const r=await fetch('/api/admin/blog/posts',{headers:{Authorization:'Bearer '+$('token').value}});const j=await r.json();$('list').innerHTML=(j.posts||[]).map(p=>`<div class="post"><strong>${p.title}</strong><br><small>${p.status} · ${p.category}</small><button style="float:right" onclick="del('${p.id}')">Delete</button></div>`).join('')}async function del(id){if(!confirm('Delete article?'))return;await fetch('/api/admin/blog/delete',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value},body:JSON.stringify({id})});loadPosts()}$('form').onsubmit=save;$('token').onchange=loadPosts;</script><script src="customer-care.js?v=20261004-2" defer></script>
</body></html>
