<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Publishing Review | CBE Nexus Admin</title><meta name="robots" content="noindex,nofollow"><style>
*{box-sizing:border-box}body{margin:0;background:#f1f6fb;color:#172b45;font:14px/1.5 Arial}header{background:#12345b;color:#fff;padding:16px 4%;font-weight:900}.wrap{max-width:1180px;margin:24px auto;padding:0 16px}.panel,.book{background:#fff;border:1px solid #dbe5ef;border-radius:13px;padding:18px;margin:14px 0}.book{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px}.cover{width:145px;max-height:210px;object-fit:contain;background:#eef2f7}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}label{font-weight:800;font-size:12px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px;margin-top:4px;font:inherit}textarea{min-height:70px}.btn{background:#0879bd;color:#fff;border:0;padding:11px 15px;border-radius:8px;font-weight:800;cursor:pointer}.muted{color:#64748b}.status{font-weight:800;color:#087a4c}@media(max-width:700px){.book{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
</style></head><body><header>CBE Nexus · Textbook Publishing Review Queue</header><main class="wrap"><section class="panel"><h1>Book quality review and ISBN administration</h1><p class="muted">Review the complete manuscript and cover, check originality, accuracy, curriculum alignment, completeness and rights to distribute. Only accept books that meet the publishing standards.</p><button class="btn" id="refresh">Refresh submissions</button><p id="status" class="status"></p></section><div id="queue"></div></main>
<script>
(async()=>{const $=id=>document.getElementById(id);async function call(url,body){const r=await fetch(url,{method:body?"POST":"GET",credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||"Request failed");return d}
async function load(){ $("status").textContent="Loading…";try{const d=await call("/api/admin/published-books");$("queue").innerHTML="";for(const b of d.books||[]){const el=document.createElement("section");el.className="book";el.innerHTML="<img class='cover' alt='Book cover'><div><h2></h2><p class='muted'></p><p class='summary'></p><p><a class='pdf' target='_blank' rel='noopener'>Open manuscript PDF</a></p><div class='grid'><label>Editorial status<select class='review'><option value='pending'>Pending</option><option value='in_review'>In review</option><option value='revision_required'>Revision required</option><option value='approved'>Accepted</option><option value='published'>Published</option><option value='rejected'>Rejected</option></select></label><label>ISBN progress<select class='isbnStatus'><option value='not_started'>Not started</option><option value='requested'>Requested</option><option value='in_process'>In process</option><option value='assigned'>Assigned</option><option value='not_applicable'>Not applicable</option></select></label><label>ISBN number<input class='isbn' placeholder='Enter assigned ISBN'></label><label>Review notes / requested changes<textarea class='notes'></textarea></label></div><p><button class='btn save'>Save review and notify publisher dashboard</button> <span class='muted result'></span></p></div>";el.querySelector("img").src=b.cover_url;el.querySelector("h2").textContent=b.title;el.querySelector(".muted").textContent="Seller: "+(b.sellers?.name||"Publisher")+" · "+b.country+" · "+b.curriculum+" · "+b.subject+" · "+b.level;el.querySelector(".summary").textContent=b.summary;el.querySelector(".pdf").href=b.pdf_url;el.querySelector(".review").value=b.status;el.querySelector(".isbnStatus").value=b.isbn_status||"not_started";el.querySelector(".isbn").value=b.isbn||"";el.querySelector(".notes").value=b.review_notes||"";el.querySelector(".save").onclick=async()=>{const status=el.querySelector(".review").value,isbnStatus=el.querySelector(".isbnStatus").value,isbn=el.querySelector(".isbn").value.trim();if(status==="approved"&&isbnStatus==="assigned"&&!isbn){el.querySelector(".result").textContent="Enter the assigned ISBN first.";return}el.querySelector(".result").textContent="Saving…";try{await call("/api/admin/published-books/review",{bookId:b.id,status,isbnStatus,isbn,reviewNotes:el.querySelector(".notes").value});el.querySelector(".result").textContent="Saved. The publisher will see this update on their dashboard.";await load()}catch(x){el.querySelector(".result").textContent=x.message}};$("queue").appendChild(el)}$("status").textContent=(d.books||[]).length+" book submissions loaded."}catch(e){$("status").textContent=e.message}}
$("refresh").onclick=load;try{const me=await call("/api/admin/me");if(me.authenticated)await load();else $("status").textContent="Please sign in to the CBE Nexus admin account first."}catch(e){$("status").textContent="Admin session required. Sign in through the secure admin console, then reload this page."}
})();
</script></body></html>
