<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CBE Nexus | Resources by Grade & Subject</title>
<meta name="description" content="Find CBE Nexus teaching and learning resources by grade, subject and resource type.">
<style>
:root{--red:#c62828;--navy:#12345b;--green:#0f7a4f;--paper:#fff;--line:#dfe5ea;--ink:#17202a}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:var(--ink)}
header{background:var(--red);color:#fff;padding:18px 5%;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.brand{color:#fff;text-decoration:none;font-weight:900;font-size:22px}.brand small{display:block;font-size:11px;font-weight:600}
.home{background:#fff;color:var(--red);padding:10px 15px;border-radius:7px;text-decoration:none;font-weight:800}
main{max-width:1200px;margin:0 auto;padding:30px 18px}.hero{background:#fff;border-radius:12px;padding:25px;border:1px solid var(--line);box-shadow:0 3px 14px #0000000b}
.eyebrow{color:var(--red);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}h1{margin:7px 0 8px} .hero p{margin:0;color:#586574}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
label{font-weight:800;font-size:13px}select,input{width:100%;margin-top:7px;padding:12px;border:1px solid #cbd5df;border-radius:7px;background:#fff;font:inherit}
.resource-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#e9f3ff;border-radius:20px;padding:5px 8px;font-size:11px;font-weight:800}.card h3{margin:13px 0 7px}.card p{color:#64717e;line-height:1.45;font-size:14px}.empty{background:#fff;border:1px dashed #bdc7d1;padding:30px;text-align:center;border-radius:10px;grid-column:1/-1}
.actions{display:flex;gap:8px;margin-top:14px}.btn{border:0;border-radius:7px;padding:10px 13px;text-decoration:none;font-weight:800;cursor:pointer}.preview{background:var(--navy);color:#fff}.whatsapp{background:#198754;color:#fff}
@media(max-width:800px){.filters,.resource-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.filters,.resource-grid{grid-template-columns:1fr}}
</style></head><body>
<header><a class="brand" href="index.html#dashboard">CBE Nexus<small>Connecting learners to excellence</small></a><a class="home" href="index.html#dashboard">← Dashboard</a></header>
<main><section class="hero"><div class="eyebrow">Teaching & Learning Resources</div><h1 id="pageTitle">Resources by Grade → Subject</h1><p>Select a grade and subject. The page automatically shows approved resources for the selected resource type.</p>
<div class="filters"><label>Grade<select id="grade"><option>All Grades</option></select></label><label>Subject<select id="subject"><option>All Subjects</option></select></label><label>Search<input id="search" placeholder="Search resources"></label></div></section>
<section id="results" class="resource-grid"><div class="empty">Loading approved resources…</div></section></main>
<script src="resource-category.js?v=20261002-1"></script></body></html>
