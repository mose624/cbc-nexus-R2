<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TVET Institution Courses | CBE Nexus</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f8fb;color:#172033}header{background:#0b3b66;color:#fff;text-align:center;padding:28px 16px}main{max-width:1100px;margin:24px auto;padding:0 16px}.panel{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:0 4px 18px #0001}.back{display:inline-block;margin-bottom:15px;text-decoration:none;color:#0b5ea8;font-weight:700}.meta{line-height:1.7;color:#526071}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{border:1px solid #e1e7ef;border-radius:12px;padding:17px}.status{font-weight:700}.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:#0b5ea8;color:white;text-decoration:none;font-weight:700;margin-top:10px}.empty{text-align:center;padding:30px}.notice{background:#fff7df;border-left:5px solid #e0a400;padding:14px}</style></head><body><header><h1 id="title">TVET Institution</h1><p>Courses, qualifications & accreditation</p></header><main><a class="back" href="technical-vocational-catalogue.html">← Back to TVET Catalogue</a><section class="panel" id="details">Loading official TVETA information…</section><section class="panel"><h2>Courses Offered</h2><div id="courses" class="grid"></div></section><section class="panel notice">Always verify the current registration/licensing status and the specific course with TVETA before applying or paying fees.</section></main><script>
(async()=>{const name=new URLSearchParams(location.search).get('institution')||'';const title=document.querySelector('#title'),details=document.querySelector('#details'),courses=document.querySelector('#courses');const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));title.textContent=name||'TVET Institution';if(!name){details.innerHTML='<p>Institution not specified.</p>';return}try{const r=await fetch('/api/tveta/institution?institution='+encodeURIComponent(name));const d=await r.json();if(!d.ok)throw new Error(d.error||'Unable to load institution');details.innerHTML='<h2>'+esc(d.institutionName)+'</h2><p class="meta">Source: TVET Authority (TVETA)</p><a class="btn" target="_blank" rel="noopener" href="'+esc(d.sourceUrl)+'">Open Official TVETA Details ↗</a>';courses.innerHTML=(d.courses||[]).map(x=>'<article class="card"><h3>'+esc(x.courseName)+'</h3><div class="meta"><strong>Level:</strong> '+esc(x.level)+'<br><strong>Examining Body:</strong> '+esc(x.examBody||'Not stated')+'</div></article>').join('')||'<div class="empty">No course rows were returned. Please check the official TVETA details page.</div>'}catch(e){details.innerHTML='<p>We could not load the live TVETA record right now.</p><p>'+esc(e.message)+'</p><a class="btn" target="_blank" rel="noopener" href="https://www.tveta.go.ke/accredited-tvet-institutions/">Check TVETA Register ↗</a>';courses.innerHTML='<div class="empty">Please use the official TVETA register to verify courses.</div>'}})();
</script></body></html>
